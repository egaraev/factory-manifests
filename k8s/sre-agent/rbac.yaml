# broad read-only access across the 4 namespaces this factory owns, plus a
# small cluster-scoped set for things that genuinely have no namespace (nodes,
# PVs, storage classes, webhook configs, CSRs, ClusterRoles/Bindings).
# sre_agent.py's investigation tools use this to inspect live cluster state
# directly instead of only inferring it from log noise -- see KAN-65/66/67,
# where fx-verify spent 3 rework rounds confused about whether a ClusterRole
# diff was even real, because it could only read git + forbidden-error spam,
# never the live object itself.
#
# still no write/delete anywhere, and nothing at all in argocd/kube-system/
# platform. the one deliberate exception to "all possible info": never
# secrets, in any namespace, any verb. a diagnostic agent that can read every
# Secret in these namespaces defeats the entire least-privilege point this
# pipeline exists to enforce -- exactly what fx-review has flagged as CONCERNS
# every time a fix PR tried to grant it to a workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-read
  namespace: ai-models
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services", "endpoints", "configmaps", "serviceaccounts", "limitranges", "resourcequotas", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-read
  namespace: ai-models
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: pipeline
roleRef:
  kind: Role
  name: sre-agent-read
  apiGroup: rbac.authorization.k8s.io
