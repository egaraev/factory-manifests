# holds the last pushed value from short-lived batch jobs prometheus can't
# scrape directly -- it's gone by the time a scrape would hit it. the
# repo-scorecard cronjob (k8s/orchestrator/scorecard-cronjob.yaml) pushes here
# once per run. scraped by its own dedicated "pushgateway" job in
# k8s/observe/prometheus.yaml (honor_labels: true, same as kube-state-metrics)
# -- deliberately NOT annotated prometheus.io/scrape here, so the generic
# kubernetes-pods job doesn't ALSO pick it up and create a second,
# non-honor_labels copy of the same series under job="kubernetes-pods"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: observe
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.4
          ports:
            - containerPort: 9091
              name: http
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: observe
spec:
  selector:
    app: pushgateway
  ports:
    - port: 9091
      targetPort: 9091
      name: http
