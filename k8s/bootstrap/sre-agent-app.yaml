apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-sre-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:egaraev/factory-manifests.git
    targetRevision: main
    path: k8s/sre-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
