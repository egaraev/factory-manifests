apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-sample-app
  namespace: sample-app
  labels:
    app: factory-sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-sample-app
  template:
    metadata:
      labels:
        app: factory-sample-app
    spec:
      containers:
        # pinned to a real git sha, not :latest -- ci updates this line itself on every
        # push to factory-sample-app's main, so a new build actually rolls the pod
        # instead of needing a manual kubectl rollout restart. IfNotPresent is correct
        # here since each tag is now a unique, immutable sha -- no reason to ever refetch one
        - name: factory-sample-app
          image: ghcr.io/egaraev/factory-sample-app:c3f02a491ec9af34ce955e9ff1dd4b8babe224f5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: factory-sample-app-nodeport
  namespace: sample-app
spec:
  type: NodePort
  selector:
    app: factory-sample-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
