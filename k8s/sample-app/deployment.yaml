apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-sample-app
  namespace: sample-app
  labels:
    app: factory-sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-sample-app
  template:
    metadata:
      labels:
        app: factory-sample-app
    spec:
      containers:
        # pinned to a real git sha, not :latest -- ci updates this line itself on every
        # push to factory-sample-app's main, so a new build actually rolls the pod
        # instead of needing a manual kubectl rollout restart. IfNotPresent is correct
        # here since each tag is now a unique, immutable sha -- no reason to ever refetch one
        - name: factory-sample-app
          image: ghcr.io/egaraev/factory-sample-app:6f92f0c43a046b341d3e5706117cfd48e93f0694
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # without this, k8s considers a pod "ready" the instant the container
          # process starts -- which can be before uvicorn has actually finished
          # booting. that's the gap a plain rolling update has today: the old
          # pod could get killed before the new one can really serve anything.
          # /hello is a real route (app/main.py) that touches no DB, so it's a
          # clean "is the ASGI server actually up" signal, not a fake stub path
          readinessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: factory-sample-app-nodeport
  namespace: sample-app
spec:
  type: NodePort
  selector:
    app: factory-sample-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
