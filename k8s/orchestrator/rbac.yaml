apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-orchestrator
  namespace: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-orchestrator
  namespace: pipeline
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-orchestrator
  namespace: pipeline
subjects:
  - kind: ServiceAccount
    name: factory-orchestrator
    namespace: pipeline
roleRef:
  kind: Role
  name: factory-orchestrator
  apiGroup: rbac.authorization.k8s.io
