apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator
  namespace: pipeline
spec:
  # polls every 2 minutes -- walks every open epic (jira_client.get_epics), so
  # a new epic just needs to exist in jira, nothing to update here anymore
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: factory-orchestrator
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret  # ai-software-factory's GHCR package is private
          containers:
            - name: orchestrator
              image: ghcr.io/egaraev/ai-software-factory:latest
              command: ["python", "orchestrator.py"]
              envFrom:
                - secretRef:
                    name: factory-pipeline-env
