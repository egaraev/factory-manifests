apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-orchestrator
  namespace: pipeline
spec:
  # polls every 2 minutes -- update the epic key in the command below whenever
  # you start a new epic; it walks that epic's tasks in order, one step per poll
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: factory-orchestrator
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret  # ai-software-factory's GHCR package is private
          containers:
            - name: orchestrator
              image: ghcr.io/egaraev/ai-software-factory:latest
              command: ["python", "orchestrator.py", "KAN-24"]
              envFrom:
                - secretRef:
                    name: factory-pipeline-env
