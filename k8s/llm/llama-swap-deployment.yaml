apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: ai-models
  labels:
    app: llama-swap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-swap
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      runtimeClassName: nvidia
      containers:
        - name: llama-swap
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda13
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          volumeMounts:
            - name: config
              mountPath: /etc/llama-swap/config/config.yaml
              subPath: config.yaml
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: llama-swap-config
        - name: models
          hostPath:
            path: /data/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llama-swap
  namespace: ai-models
spec:
  selector:
    app: llama-swap
  ports:
    - port: 8080
      targetPort: 8080
      name: http
