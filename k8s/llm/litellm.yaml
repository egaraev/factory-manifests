apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-models
data:
  config.yaml: |
    model_list:
      - model_name: fx-cheap
        litellm_params:
          model: openai/qwen3.8-27b-Fast
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: fx-strong
        litellm_params:
          model: openai/qwen3.8-27b-Expert
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: fx-code
        litellm_params:
          model: openai/qwen3.8-27b-Fast
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: fx-code-hard
        litellm_params:
          model: openai/qwen3.8-27b-Expert
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"
          stream_timeout: 60
      - model_name: fx-verify
        litellm_params:
          # swapped from deepseek-v3.2 -- v3.2 kept acknowledging reviewer
          # feedback in its own prose without actually putting the change in
          # its file block (see KAN-65's 3 rework rounds), v4-pro-0813 scores
          # noticeably higher on SWE-bench Verified and is still a fraction of
          # fx-review/Sonnet's price. same vendor/family, easy to compare
          model: openrouter/deepseek/deepseek-v4-pro-0813
          api_key: os.environ/OPENROUTER_API_KEY
          cache_control_injection_points: [...]
      - model_name: fx-review
        litellm_params:
          model: openrouter/anthropic/claude-sonnet-5
          api_key: os.environ/OPENROUTER_API_KEY
          cache_control_injection_points: [...]
      - model_name: nomic-embed-text-v1.5
        litellm_params:
          model: openai/nomic-embed-text-v1.5
          api_base: http://llama-swap.ai-models.svc.cluster.local:8080/v1
          api_key: "none"

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      allow_requests_on_db_unavailable: true

    litellm_settings:
      drop_params: true
      callbacks: ["prometheus"]  # exposes /metrics, scraped via the pod annotation below
      success_callback: ["langfuse"]  # traces every call -- see k8s/observe/langfuse.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-models
  labels:
    app: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/litellm-extra/config.yaml", "--port", "4000"]
          ports: [{containerPort: 4000, name: http}]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: litellm-secret, key: master_key}}
            - name: OPENROUTER_API_KEY
              valueFrom: {secretKeyRef: {name: openrouter-secret, key: OPENROUTER_API_KEY}}
            # langfuse project keys don't exist until a human creates a project in its UI
            # (see secrets/README.md) -- optional:true means litellm starts fine without
            # them, tracing just silently no-ops until the secret's filled in and this
            # pod restarts
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: langfuse-litellm-secret, key: LANGFUSE_PUBLIC_KEY, optional: true}}
            - name: LANGFUSE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: langfuse-litellm-secret, key: LANGFUSE_SECRET_KEY, optional: true}}
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.observe.svc.cluster.local:3000"
          volumeMounts: [{name: config, mountPath: /litellm-extra}]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: ai-models}
spec:
  selector: {app: litellm}
  ports: [{port: 4000, targetPort: 4000, name: http}]
