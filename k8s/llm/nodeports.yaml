apiVersion: v1
kind: Service
metadata:
  name: litellm-nodeport
  namespace: ai-models
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: llama-swap-nodeport
  namespace: ai-models
spec:
  type: NodePort
  selector:
    app: llama-swap
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
      name: http
