apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: ai-models
data:
  config.yaml: |
    healthCheckTimeout: 300
    logLevel: info

    models:

      qwen3.8-27b-Expert:
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/Qwen3.8-27B-UD-IQ4_XS.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 8
          --load-mode none
          --parallel 1
          -b 512 -ub 64
          -fa on
          -c 100000 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort xhigh
        env:
          - "CUDA_VISIBLE_DEVICES=GPU-832b5f69-26d2-3908-7838-831fc0b98a17"  # 5070 Ti, pinned by UUID
        ttl: 300

      qwen3.8-27b-Fast:
        # lighter quant, not load-tested yet, keep an eye on VRAM
        cmd: |
          llama-server
          -m /models/qwen3.8-27B/vision/Qwen3.8-27B-UD-Q3_K_XL.gguf
          --port ${PORT}
          --host 0.0.0.0
          --jinja
          -ngl 99
          -t 8
          --load-mode none
          --parallel 1
          -b 512 -ub 64
          -fa on
          -c 65536 -ctk q4_0 -ctv q4_0
          --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
          --presence-penalty 1.5 --repeat-penalty 1.0
          --reasoning-budget 4096
          --reasoning-effort xhigh
        env:
          - "CUDA_VISIBLE_DEVICES=GPU-832b5f69-26d2-3908-7838-831fc0b98a17"
        ttl: 300

      # was in litellm's model_list (knowledge_client.py's embedding calls)
      # since the knowledge base went in, but never actually had a route
      # here -- litellm forwarded by model name "nomic-embed-text-v1.5",
      # llama-swap had nothing to match it to ("no router for requested
      # model"), so every embedding call failed silently. --pooling still
      # left out (GGUF's own metadata picks the right pooling type).
      # -c/-b/-ub ARE set now though, after a real failure showed why they
      # can't be left on llama.cpp's own defaults for this use case: a
      # reviewer_agent call with a 637-token ticket+diff input got rejected
      # with "input (637 tokens) is too large to process... current batch
      # size: 512" -- an embedding/pooling pass needs its whole input in one
      # physical batch (ubatch), unlike causal generation which can split
      # across batches, so the default 512 ubatch silently caps every
      # embedding call. knowledge_client.py bounds its query text to 2000
      # chars, so 4096 tokens of context/batch is a comfortable margin even
      # for dense code/diff text
      nomic-embed-text-v1.5:
        cmd: |
          llama-server
          -m /models/nomic-embed-text-v1.5/nomic-embed-text-v1.5.Q8_0.gguf
          --port ${PORT}
          --host 0.0.0.0
          --embeddings
          -ngl 99
          -t 8
          -c 4096 -b 4096 -ub 4096
        env:
          - "CUDA_VISIBLE_DEVICES=GPU-832b5f69-26d2-3908-7838-831fc0b98a17"  # 5070 Ti, same as the others -- tiny (146MB) model, shares fine
        ttl: 300
